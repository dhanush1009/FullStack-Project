version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disaster-mgmt-backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    env_file:
      - ./backend/.env # Assumes a .env exists in backend for DB/Twilio secrets

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: disaster-mgmt-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  jenkins:
    build:
      context: .
      dockerfile: Jenkins.Dockerfile
    container_name: disaster-mgmt-jenkins
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount the docker socket so Jenkins can run Docker builds!
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: disaster-mgmt-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: disaster-mgmt-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  jenkins_home:
